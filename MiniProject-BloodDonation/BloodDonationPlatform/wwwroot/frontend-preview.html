<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التبرع بالدم - واجهة المستخدم</title>
    
    <!-- Google Fonts Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5.3 RTL CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f4f7f6;
        }
        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .form-control, .form-select {
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
        }
        .form-control:focus, .form-select:focus {
            box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.25);
            border-color: #dc3545;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-danger shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="#">
                <i class="fa-solid fa-heart-pulse me-2"></i>منصة التبرع بالدم
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container my-5">
        <div class="row g-4">
            
            <!-- نموذج تسجيل الحساب -->
            <div class="col-lg-6">
                <div class="card h-100">
                    <div class="card-header bg-danger text-white text-center py-4 rounded-top-4">
                        <h3 class="mb-1"><i class="fa-solid fa-user-plus me-2"></i>إنشاء حساب جديد</h3>
                        <p class="mb-0 text-white-50 small">انضم إلينا لإنقاذ الأرواح</p>
                    </div>
                    <div class="card-body p-4">
                        <form>
                            <div class="mb-3">
                                <label class="form-label fw-bold">الاسم الكامل</label>
                                <input type="text" class="form-control" placeholder="أدخل اسمك الكامل">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">البريد الإلكتروني</label>
                                <input type="email" class="form-control" placeholder="name@example.com">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">كلمة المرور</label>
                                <input type="password" class="form-control" placeholder="••••••••">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">رقم الهاتف</label>
                                <input type="tel" class="form-control" placeholder="01012345678">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">نوع الحساب</label>
                                <select class="form-select">
                                    <option value="">-- اختر نوع الحساب --</option>
                                    <option value="Donor">متبرع (Donor)</option>
                                    <option value="Hospital">مستشفى / بنك دم (Hospital)</option>
                                </select>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold">فصيلة الدم</label>
                                <select class="form-select">
                                    <option value="">-- اختر فصيلة الدم --</option>
                                    <option value="A+">A+</option>
                                    <option value="A-">A-</option>
                                    <option value="B+">B+</option>
                                    <option value="B-">B-</option>
                                    <option value="AB+">AB+</option>
                                    <option value="AB-">AB-</option>
                                    <option value="O+">O+</option>
                                    <option value="O-">O-</option>
                                </select>
                            </div>
                            <button type="button" class="btn btn-danger w-100 py-3 rounded-pill fw-bold shadow-sm">تسجيل الحساب</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- نموذج طلب الدم -->
            <div class="col-lg-6">
                <div class="card h-100">
                    <div class="card-header bg-dark text-white text-center py-4 rounded-top-4">
                        <h3 class="mb-1"><i class="fa-solid fa-file-medical me-2"></i>طلب توفير وحدات دم</h3>
                        <p class="mb-0 text-white-50 small">أدخل بيانات الطلب الطارئ بدقة</p>
                    </div>
                    <div class="card-body p-4">
                        <form>
                            <div class="mb-3">
                                <label class="form-label fw-bold">معرف أو اسم المستشفى</label>
                                <input type="number" class="form-control" placeholder="أدخل معرف المستشفى">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">فصيلة الدم المطلوبة</label>
                                <select class="form-select">
                                    <option value="">-- اختر الفصيلة --</option>
                                    <option value="A+">A+</option>
                                    <option value="A-">A-</option>
                                    <option value="B+">B+</option>
                                    <option value="B-">B-</option>
                                    <option value="AB+">AB+</option>
                                    <option value="AB-">AB-</option>
                                    <option value="O+">O+</option>
                                    <option value="O-">O-</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">عدد الوحدات المطلوبة</label>
                                <input type="number" class="form-control" placeholder="مثال: 3" min="1">
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold">حالة الطلب</label>
                                <select class="form-select">
                                    <option value="Pending">قيد الانتظار (Pending)</option>
                                    <option value="Urgent">عاجل جداً (Urgent)</option>
                                </select>
                            </div>
                            <button type="button" class="btn btn-dark w-100 py-3 rounded-pill fw-bold shadow-sm mt-4">إرسال طلب الدم</button>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
